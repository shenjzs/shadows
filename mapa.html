<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa GTA V - Live in Shadows</title>
    
    <!-- Biblioteka Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Czcionki Google Fonts dopasowane do klimatu grafiki -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030303;
            --bg-panel: rgba(10, 10, 10, 0.85);
            --gold-primary: #b08d57;
            --gold-secondary: #7a633f;
            --gold-glow: rgba(176, 141, 87, 0.3);
            --text-light: #e0d8c8;
            --text-muted: #999388;
            --border-gold: 1px solid var(--gold-secondary);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }

        /* Przyciemniające tło dla modala */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
        }

        /* Panel dodawania blipa (Modal) */
        #blipModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-panel);
            border: 1px solid var(--gold-primary);
            padding: 30px;
            z-index: 1000;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 15px var(--gold-glow) inset;
            width: 340px;
            border-radius: 4px;
            backdrop-filter: blur(10px);
        }

        #blipModal h2 {
            color: var(--gold-primary);
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            text-align: center;
            font-weight: 700;
            letter-spacing: 4px;
            border-bottom: 1px solid var(--gold-secondary);
            padding-bottom: 15px;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        #blipModal input[type="text"], #blipModal textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-light);
            border: 1px solid #333;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        #blipModal input[type="text"]:focus, #blipModal textarea:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px var(--gold-glow);
            background: rgba(0, 0, 0, 0.8);
        }

        #blipModal input::placeholder, #blipModal textarea::placeholder {
            color: #555;
            letter-spacing: 1px;
        }

        /* Wybór koloru w modalu */
        .color-picker-label {
            display: block;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .color-options {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .color-options input[type="radio"] {
            display: none;
        }

        .color-options label {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            background-color: var(--c);
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            transition: all 0.2s ease;
            display: inline-block;
        }

        .color-options input[type="radio"]:checked + label {
            border-color: #fff;
            box-shadow: 0 0 12px var(--c), inset 0 0 4px rgba(0,0,0,0.5);
            transform: scale(1.2);
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        #blipModal button {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--gold-primary);
            border: 1px solid var(--gold-secondary);
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 12px;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        #blipModal button#saveBlipBtn:hover {
            background: var(--gold-primary);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--gold-glow);
            border-color: var(--gold-primary);
        }

        #blipModal button#cancelBlipBtn {
            color: var(--text-muted);
            border-color: #444;
        }

        #blipModal button#cancelBlipBtn:hover {
            background: #222;
            color: #fff;
            border-color: #666;
        }

        /* Prawy panel boczny z listą blipów (Styl GTA V) */
        #sidebarPanel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            max-height: calc(100vh - 40px);
            background: var(--bg-panel);
            border: 1px solid var(--gold-secondary);
            border-radius: 4px;
            z-index: 800;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 10px var(--gold-glow) inset;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--gold-secondary);
        }

        .sidebar-header h3 {
            margin: 0 0 10px 0;
            color: var(--gold-primary);
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #blipSearchInput {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--text-light);
            border: 1px solid #333;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        #blipSearchInput:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px var(--gold-glow);
        }

        #blipSearchInput::placeholder {
            color: #555;
        }

        .sidebar-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            max-height: calc(100vh - 140px);
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(122, 99, 63, 0.2);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .sidebar-item:hover {
            background: rgba(176, 141, 87, 0.1);
        }

        .sidebar-item-info {
            display: flex;
            align-items: center;
            overflow: hidden;
            margin-right: 10px;
        }

        .sidebar-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--bg-dark);
            border: 2px solid var(--c);
            box-shadow: 0 0 6px var(--c);
            margin-right: 10px;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 12px;
            color: var(--text-light);
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-delete-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
            padding: 0 4px;
        }

        .sidebar-delete-btn:hover {
            color: #ff4444;
        }

        /* Legenda na mapie (przeniesiona niżej pod listę lub obok) */
        #mapLegend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--bg-panel);
            border: 1px solid var(--gold-secondary);
            padding: 12px 18px;
            border-radius: 4px;
            z-index: 800;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 10px var(--gold-glow) inset;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        #mapLegend h3 {
            margin: 0 0 8px 0;
            color: var(--gold-primary);
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }

        #mapLegend ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #mapLegend li {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        #mapLegend li:last-child {
            margin-bottom: 0;
        }

        #mapLegend li span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--bg-dark);
            border: 2px solid var(--c);
            box-shadow: 0 0 6px var(--c);
            margin-right: 10px;
        }

        /* Stylowanie popupów Leaflet na mapie */
        .leaflet-popup-content-wrapper {
            background: var(--bg-panel) !important;
            color: var(--text-light) !important;
            border: 1px solid var(--gold-primary);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 10px var(--gold-glow) inset;
            backdrop-filter: blur(5px);
            padding: 5px;
        }

        .leaflet-popup-tip-container {
            display: none !important;
        }

        .leaflet-popup-content {
            margin: 15px 20px;
            text-align: center;
        }

        .leaflet-popup-content h3 {
            color: var(--gold-primary);
            margin: 0 0 12px 0;
            border-bottom: 1px solid var(--gold-secondary);
            padding-bottom: 10px;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(176, 141, 87, 0.4);
        }

        .leaflet-popup-content p {
            margin: 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-light);
            font-weight: 300;
        }

        .leaflet-popup-close-button {
            color: var(--gold-primary) !important;
            text-shadow: none;
            font-size: 18px !important;
            padding: 5px !important;
            transition: color 0.3s;
        }

        .leaflet-popup-close-button:hover {
            color: #fff !important;
        }
        
        /* Kontrolki zoomu */
        .leaflet-control-zoom-in, .leaflet-control-zoom-out {
            background-color: rgba(10, 10, 10, 0.8) !important;
            color: var(--gold-primary) !important;
            border: 1px solid var(--gold-secondary) !important;
            font-family: 'Cinzel', serif !important;
            transition: all 0.3s ease;
        }

        .leaflet-control-zoom-in:hover, .leaflet-control-zoom-out:hover {
            background-color: var(--gold-primary) !important;
            color: var(--bg-dark) !important;
        }

        /* Dynamiczna ikona blipa ze świeceniem */
        .custom-map-icon div {
            background-color: var(--bg-dark);
            width: 14px;
            height: 14px;
            border: 2px solid;
            border-radius: 50%;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .custom-map-icon:hover div {
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <!-- Prawy Panel Boczny (Lista Blipów + Wyszukiwarka) -->
    <div id="sidebarPanel">
        <div class="sidebar-header">
            <h3>Lista Punktów</h3>
            <input type="text" id="blipSearchInput" placeholder="Szukaj blipa..." autocomplete="off">
        </div>
        <ul class="sidebar-list" id="sidebarBlipsList">
            <!-- Tutaj dynamicznie wpadają punkty -->
        </ul>
    </div>

    <!-- Legenda Mapy -->
    <div id="mapLegend">
        <h3>Legenda</h3>
        <ul>
            <li><span style="--c: #b08d57;"></span> Główny cel / Domyślny</li>
            <li><span style="--c: #ff4444;"></span> Zagrożenie / Wrogowie</li>
            <li><span style="--c: #44ff44;"></span> Sojusznicy / Bezpieczne</li>
            <li><span style="--c: #44aaff;"></span> Teren neutralny / Info</li>
            <li><span style="--c: #aa44ff;"></span> Ważny punkt / Inne</li>
        </ul>
    </div>

    <div id="modalOverlay"></div>
    <div id="blipModal">
        <h2>Nowy Punkt</h2>
        
        <div class="input-group">
            <input type="text" id="blipTitle" placeholder="NAZWA OPERACYJNA" autocomplete="off">
        </div>
        
        <div class="input-group">
            <textarea id="blipDesc" rows="4" placeholder="Szczegóły lokalizacji..."></textarea>
        </div>

        <span class="color-picker-label">Kategoria (Kolor):</span>
        <div class="color-options">
            <input type="radio" name="blipColor" value="#b08d57" id="c_gold" checked>
            <label for="c_gold" style="--c: #b08d57;" title="Złoty"></label>

            <input type="radio" name="blipColor" value="#ff4444" id="c_red">
            <label for="c_red" style="--c: #ff4444;" title="Czerwony"></label>

            <input type="radio" name="blipColor" value="#44ff44" id="c_green">
            <label for="c_green" style="--c: #44ff44;" title="Zielony"></label>

            <input type="radio" name="blipColor" value="#44aaff" id="c_blue">
            <label for="c_blue" style="--c: #44aaff;" title="Niebieski"></label>

            <input type="radio" name="blipColor" value="#aa44ff" id="c_purple">
            <label for="c_purple" style="--c: #aa44ff;" title="Fioletowy"></label>
        </div>

        <div class="btn-container">
            <button id="cancelBlipBtn">Anuluj</button>
            <button id="saveBlipBtn">Zatwierdź</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Wymiary oryginalnego pliku mapy
        const w = 8192;
        const h = 8192;
        const bounds = [[0, 0], [h, w]];

        // Inicjalizacja mapy
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -4,
            maxZoom: 2,
            zoomControl: true,
            maxBounds: bounds,
            maxBoundsViscosity: 1.0,
            zoomSnap: 0 
        });

        // Link do mapy GTA V
        const imageUrl = 'https://www.bragitoff.com/wp-content/uploads/2015/11/GTAV_ATLUS_2048x2048.png';
        L.imageOverlay(imageUrl, bounds).addTo(map);
        
        // Ustawienie widoku początkowego mapy
        map.setView([5200, 4096], -2);

        // Elementy interfejsu
        const modal = document.getElementById('blipModal');
        const overlay = document.getElementById('modalOverlay');
        const titleInput = document.getElementById('blipTitle');
        const descInput = document.getElementById('blipDesc');
        const saveBtn = document.getElementById('saveBlipBtn');
        const cancelBtn = document.getElementById('cancelBlipBtn');
        const searchInput = document.getElementById('blipSearchInput');
        const sidebarList = document.getElementById('sidebarBlipsList');

        let currentCoordinates = null;

        // Inicjalizacja tablicy blipów z LocalStorage (pamięci przeglądarki)
        let savedBlips = JSON.parse(localStorage.getItem('gtaMapBlips')) || [];
        // Tablica przechowująca referencje do obiektów markerów na mapie
        let markerReferences = [];

        // Funkcja generująca niestandardową ikonę w zależności od wybranego koloru
        function getCustomIcon(color) {
            return L.divIcon({
                className: 'custom-map-icon',
                html: `<div style="border-color: ${color}; box-shadow: 0 0 12px ${color}, inset 0 0 4px ${color};" 
                            onmouseenter="this.style.backgroundColor='${color}'" 
                            onmouseleave="this.style.backgroundColor='var(--bg-dark)'"></div>`,
                iconSize: [18, 18],
                iconAnchor: [9, 9],
                popupAnchor: [0, -12]
            });
        }

        // Renderowanie listy w panelu bocznym
        function renderSidebar(filterText = '') {
            sidebarList.innerHTML = '';
            
            savedBlips.forEach((blip, index) => {
                if (filterText && !blip.title.toLowerCase().includes(filterText.toLowerCase())) {
                    return;
                }

                const blipColor = blip.color || '#b08d57';

                const li = document.createElement('li');
                li.className = 'sidebar-item';
                
                li.innerHTML = `
                    <div class="sidebar-item-info" style="flex: 1;">
                        <span class="sidebar-dot" style="--c: ${blipColor};"></span>
                        <span class="sidebar-title" title="${blip.title}">${blip.title}</span>
                    </div>
                    <button class="sidebar-delete-btn" title="Usuń punkt">&times;</button>
                `;

                // Kliknięcie w element listy -> centrowanie mapy na blipie i otwarcie popupu
                li.querySelector('.sidebar-item-info').onclick = function() {
                    map.setView([blip.coords.lat, blip.coords.lng], 0);
                    if (markerReferences[index]) {
                        markerReferences[index].openPopup();
                    }
                };

                // Kliknięcie w krzyżyk -> usunięcie blipa
                li.querySelector('.sidebar-delete-btn').onclick = function(e) {
                    e.stopPropagation();
                    deleteBlip(index);
                };

                sidebarList.appendChild(li);
            });
        }

        // Funkcja usuwająca blip
        function deleteBlip(index) {
            // Usuń marker z mapy
            if (markerReferences[index]) {
                map.removeLayer(markerReferences[index]);
            }
            
            // Usuń z tablic i zapisu
            savedBlips.splice(index, 1);
            markerReferences.splice(index, 1);
            localStorage.setItem('gtaMapBlips', JSON.stringify(savedBlips));
            
            // Odśwież listę boczną
            renderSidebar(searchInput.value);
        }

        // Funkcja renderująca blip na mapie
        function renderBlip(coords, title, desc, color, index) {
            const blipColor = color || '#b08d57'; 
            
            const marker = L.marker([coords.lat, coords.lng], {icon: getCustomIcon(blipColor)}).addTo(map);
            
            const popupHTML = `
                <div>
                    <h3 style="color: ${blipColor}; border-bottom-color: ${blipColor};">${title}</h3>
                    <p>${desc}</p>
                </div>
            `;
            marker.bindPopup(popupHTML);
            
            markerReferences[index] = marker;
        }

        // Inicjalne ładowanie blipów na mapę i do panelu
        function loadAllBlips() {
            markerReferences = [];
            savedBlips.forEach((blip, index) => {
                renderBlip(blip.coords, blip.title, blip.desc, blip.color, index);
            });
            renderSidebar();
        }

        loadAllBlips();

        // Wyszukiwarka na żywo w panelu
        searchInput.oninput = function() {
            renderSidebar(searchInput.value);
        };

        // Funkcja zamykająca modal
        function closeModal() {
            modal.style.display = 'none';
            overlay.style.display = 'none';
            currentCoordinates = null;
        }

        // Otwieranie panelu po kliknięciu na mapę
        map.on('click', function(e) {
            currentCoordinates = e.latlng;
            overlay.style.display = 'block';
            modal.style.display = 'block';
            titleInput.value = '';
            descInput.value = '';
            
            document.getElementById('c_gold').checked = true;
            
            titleInput.focus();
        });

        // Zamknięcie panelu (Anuluj)
        cancelBtn.onclick = closeModal;
        overlay.onclick = closeModal;

        // Zapisywanie blipa
        saveBtn.onclick = function() {
            if (currentCoordinates) {
                const title = titleInput.value.trim() || 'NIEZNANY PUNKT';
                const desc = descInput.value.trim() || 'Brak danych operacyjnych.';
                const selectedColor = document.querySelector('input[name="blipColor"]:checked').value;
                
                const newBlip = {
                    coords: currentCoordinates,
                    title: title,
                    desc: desc,
                    color: selectedColor
                };
                
                savedBlips.push(newBlip);
                localStorage.setItem('gtaMapBlips', JSON.stringify(savedBlips));

                // Ponowne załadowanie wszystkich (najprostszy sposób na zachowanie spójnych indeksów)
                loadAllBlips();
                
                closeModal();
            }
        };

        // Zamknięcie przyciskiem Escape
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape" && modal.style.display === 'block') {
                closeModal();
            }
        });
    </script>
</body>
</html>
